<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4e9a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="แจ้งซ่อมไฟ">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E">
<title>แจ้งซ่อมไฟฟ้าสาธารณะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme { --color-brand: #1e4e9a; --color-brand-dark: #163a73; --color-brand-soft: #e8eef8; --color-accent: #f2b632; --color-accent-soft: #fdf3d8; --color-accent-dark: #8a5b00; --color-paper: #f3f6fb; --color-line: #d9e1ee; --color-ink: #1f2937; --color-muted: #475569; --font-sans: "Sarabun", "Segoe UI", system-ui, sans-serif; }
</style>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/config.js"></script>
</head>
<body class="bg-paper text-ink font-sans">
<div class="max-w-lg md:max-w-xl mx-auto p-4">
  <header class="bg-brand text-white rounded-b-2xl -mt-4 -mx-4 px-4 py-3.5 flex items-center gap-3 border-b-4 border-accent">
    <img id="logo" alt="" class="h-12 w-12 rounded-full bg-white object-cover flex-none hidden" onload="this.classList.remove('hidden')" onerror="this.remove()">
    <div class="min-w-0 leading-tight">
      <h1 class="text-lg font-extrabold m-0">แจ้งซ่อมไฟฟ้าสาธารณะ</h1>
      <p class="text-xs opacity-85 m-0 truncate" id="orgLine"></p>
    </div>
  </header>

  <div id="app" class="mt-4"><div class="text-center text-muted py-10">กำลังตรวจสอบเสาไฟ…</div></div>

  <p class="text-xs text-muted text-center mt-4" id="footLine"></p>
</div>

<script>
  document.getElementById('orgLine').textContent = ORG.name + ' ' + ORG.area;
  if (ORG.logo) document.getElementById('logo').src = ORG.logo;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
  document.getElementById('footLine').textContent = 'ดำเนินการในวันเวลาราชการ · ไม่เกิน ' + ORG.sla_days + ' วันทำการ · โทร ' + ORG.phone;

  var qs = new URLSearchParams(location.search);
  var POLE = (qs.get('pole') || '').trim(), K = qs.get('k') || '';
  var OPENED_AT = Date.now();   // จับเวลาตั้งแต่เปิดหน้า กันบอทส่งทันที
  var gps = { lat:'', lng:'' };
  var app = document.getElementById('app');

  var I = 'w-full px-3.5 py-3 rounded-[10px] border border-line bg-white text-ink text-base placeholder:text-slate-500 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/30';
  var LBL = 'block font-bold text-base mt-4 mb-1.5';
  var ICO = {
    check:'<path d="M5 12l5 5l10 -10"/>',
    warn:'<path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/>',
    bell:'<path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/>',
    x:'<path d="M18 6l-12 12"/><path d="M6 6l12 12"/>',
    pin:'<path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z"/>',
    lock:'<path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/>'
  };
  function ico(n,cls){ return '<svg class="ic '+(cls||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+ICO[n]+'</svg>'; }
  /** ไอคอนวงกลมใหญ่สำหรับหน้าผลลัพธ์ (สี + รูป + ข้อความหัวเรื่อง) */
  function bigIco(n,cls){ return '<div class="mx-auto w-16 h-16 rounded-full flex items-center justify-center '+cls+'"><svg class="ic" style="width:2rem;height:2rem" viewBox="0 0 24 24" aria-hidden="true">'+ICO[n]+'</svg></div>'; }
  function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }
  function card(inner, cls){ return '<div class="bg-white border border-line rounded-2xl p-5 '+(cls||'')+'">'+inner+'</div>'; }
  function doneBox(icon, title, color, html){
    return card('<div class="text-center py-4">'+icon+'<h2 class="text-xl font-extrabold my-3 '+color+'">'+title+'</h2>'+html+'</div>');
  }

  /** fetch ที่ยอมแพ้เมื่อเกินเวลา จะได้ไม่ค้าง "กำลังส่ง..." ไปตลอด */
  function fetchT(url, opt, ms){
    var ac = new AbortController(), t = setTimeout(function(){ ac.abort(); }, ms || 20000);
    return fetch(url, Object.assign({}, opt, { signal: ac.signal }))
      .catch(function(e){ throw new Error(e.name === 'AbortError' ? 'ระบบตอบช้าเกินไป' : 'เชื่อมต่ออินเทอร์เน็ตไม่ได้'); })
      .finally(function(){ clearTimeout(t); });
  }
  async function readJson(r){
    var j; try { j = await r.json(); } catch(e){ throw new Error('เซิร์ฟเวอร์ขัดข้อง (รหัส '+r.status+')'); }
    if (!r.ok) throw new Error(j.error || ('เซิร์ฟเวอร์ขัดข้อง (รหัส '+r.status+')'));
    return j;
  }

  async function init(){
    var res;
    try {
      var r = await fetchT('/api/pole?pole='+encodeURIComponent(POLE)+'&k='+encodeURIComponent(K));
      res = await readJson(r);
    } catch(e){ app.innerHTML = doneBox(bigIco('warn','bg-accent-soft text-accent-dark'),'เชื่อมต่อไม่ได้','text-[var(--new)]','<p>กรุณาลองใหม่ หรือโทร '+ORG.phone+'</p><p class="text-xs text-muted mt-2">'+esc(e.message)+'</p>'); return; }

    if (!res.qrOk) {
      app.innerHTML = doneBox(bigIco('x','bg-red-50 text-[var(--new)]'),'ลิงก์ไม่ถูกต้อง','text-[var(--new)]',
        '<p>กรุณาสแกน QR Code จากสติกเกอร์บนเสาไฟอีกครั้ง<br>หรือโทร <a class="text-brand font-bold" href="tel:'+ORG.phoneTel+'">'+ORG.phone+'</a></p>');
      return;
    }
    if (res.openReport) {
      app.innerHTML = doneBox(bigIco('bell','bg-accent-soft text-accent-dark'),'เสา '+esc(res.pole_id)+' มีคนแจ้งไว้แล้ว','text-accent-dark',
        '<p>เลขที่แจ้ง <span class="font-mono bg-brand-soft text-brand font-bold px-2 py-0.5 rounded">'+esc(res.openReport.report_id)+'</span><br>สถานะ: <b>'+esc(res.openReport.status)+'</b></p>'+
        '<p class="text-sm text-muted mt-3">'+ORG.dept+'กำลังดำเนินการ ไม่ต้องแจ้งซ้ำครับ<br>หากอาการเปลี่ยน/เร่งด่วน โทร <a class="text-brand font-bold" href="tel:'+ORG.phoneTel+'">'+ORG.phone+'</a></p>');
      return;
    }
    renderForm(res.pole_id, res.pole);
  }

  function renderForm(poleId, pole){
    var parts = poleId.split('/'), moo = parts[0], ton = parts[1];
    var badge;
    if (pole) {
      badge = '<div class="flex items-center gap-4 bg-brand-soft border-2 border-brand rounded-2xl px-4 py-3">'+
        '<div class="text-4xl font-extrabold text-brand leading-none tracking-tight">'+esc(pole.pole_id)+'</div>'+
        '<div class="text-sm text-muted"><div class="font-bold text-ink text-base">เสาที่คุณสแกน</div>'+
        (ton?'<div>หมู่ '+esc(moo)+' ต้นที่ '+esc(ton)+'</div>':'')+(pole.address?'<div>'+esc(pole.address)+'</div>':'')+
        '<div class="text-[var(--done)] font-semibold inline-flex items-center gap-1 mt-0.5">'+ico('check')+'ระบุตำแหน่งให้อัตโนมัติแล้ว</div></div></div>';
    } else if (poleId) {
      badge = '<div class="flex items-center gap-4 bg-brand-soft border-2 border-brand rounded-2xl px-4 py-3">'+
        '<div class="text-4xl font-extrabold text-brand leading-none tracking-tight">'+esc(poleId)+'</div>'+
        '<div class="text-sm text-muted"><b class="text-ink text-base">'+(ton?'หมู่ '+esc(moo)+' ต้นที่ '+esc(ton):'เลขเสา '+esc(poleId))+'</b><br>(ยังไม่มีพิกัดในระบบ ช่างจะตรวจสอบ)</div></div>';
    } else {
      badge = '<div class="bg-accent-soft border-2 border-accent text-accent-dark rounded-2xl px-4 py-3 text-sm flex items-start gap-2">'+ico('warn','mt-0.5')+'<span>ไม่พบเลขเสาจาก QR — กรุณากรอกเลขเสาด้านล่าง (ดูที่สติกเกอร์บนเสา)</span></div>'+
        '<label class="'+LBL+'">เลขเสา (หมู่/ต้นที่) <span class="text-[var(--new)]">*</span></label><input id="manualPole" class="'+I+'" placeholder="เช่น 1/14 = หมู่ 1 ต้นที่ 14">';
    }
    app.innerHTML = '<div id="formArea">'+card(badge+
      '<label class="'+LBL+'">ชื่อผู้แจ้ง <span class="text-[var(--new)]">*</span></label><input id="name" class="'+I+'" placeholder="เช่น นางสมพร" autocomplete="name">'+
      '<label class="'+LBL+'">เบอร์โทรติดต่อกลับ <span class="text-[var(--new)]">*</span></label><input id="phone" class="'+I+'" placeholder="เช่น 08XXXXXXXX" inputmode="tel" autocomplete="tel">'+
      '<label class="'+LBL+'">อาการที่พบ <span class="text-[var(--new)]">*</span></label>'+
      '<div class="flex flex-wrap gap-2 mb-2" id="quick">'+['ไฟดับทั้งต้น','ไฟกะพริบ','ไฟติดกลางวัน','โคมแตก/ห้อย','สายไฟหลุด/ห้อยต่ำ','เสาเอียง/ล้ม'].map(function(t){
        return '<button type="button" class="px-4 py-2 rounded-full border-2 border-brand text-brand text-base font-semibold bg-white hover:bg-brand-soft" onclick="pick(this)">'+t+'</button>';}).join('')+'</div>'+
      '<textarea id="detail" class="'+I+' min-h-[88px]" placeholder="พิมพ์เพิ่มได้ เช่น ดับมา 3 คืนแล้ว"></textarea>'+
      '<div style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true"><label>Website</label><input id="website" tabindex="-1" autocomplete="off"></div>'+
      (!pole ? '<div class="flex items-center gap-2 mt-3"><button type="button" class="inline-flex items-center gap-1 px-3 py-2 rounded-[10px] border-2 border-brand text-brand bg-white text-sm font-semibold hover:bg-brand-soft" onclick="getGPS()">'+ico('pin')+'แนบตำแหน่งปัจจุบัน</button><span class="text-xs text-muted" id="gpsStatus">ช่วยให้ช่างหาเสาเจอง่ายขึ้น</span></div>' : '')+
      '<button id="btn" class="w-full mt-5 py-4 rounded-[10px] bg-brand hover:bg-brand-dark text-white text-xl font-extrabold disabled:opacity-60" onclick="submitForm()">ส่งเรื่องแจ้งซ่อม</button>'+
      '<p class="text-xs text-muted mt-3 flex items-start gap-1.5">'+ico('lock','mt-0.5')+'<span>ชื่อและเบอร์โทรใช้เพื่อติดต่อกลับเรื่องการซ่อมเท่านั้น เก็บรักษาโดย'+ORG.dept+' '+ORG.short+' ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล (PDPA)</span></p>')+
      '</div><div id="doneArea" class="hidden"></div>';
  }

  function pick(b){
    var d=document.getElementById('detail'); var t=b.textContent;
    if (d.value.indexOf(t)>=0) { d.value = d.value.replace(t,'').replace(/\s+/g,' ').trim(); b.classList.remove('bg-brand','text-white'); b.classList.add('bg-white','text-brand'); b.setAttribute('aria-pressed','false'); }
    else { d.value = d.value ? d.value+' '+t : t; b.classList.remove('bg-white','text-brand'); b.classList.add('bg-brand','text-white'); b.setAttribute('aria-pressed','true'); }
  }
  function getGPS(){
    var s=document.getElementById('gpsStatus');
    if(!navigator.geolocation){ s.textContent='อุปกรณ์ไม่รองรับ GPS'; return; }
    s.textContent='กำลังหาตำแหน่ง...';
    navigator.geolocation.getCurrentPosition(function(p){
      gps.lat=p.coords.latitude.toFixed(6); gps.lng=p.coords.longitude.toFixed(6);
      s.textContent='แนบแล้ว ('+gps.lat+', '+gps.lng+')';
    }, function(){ s.textContent='ไม่สามารถเข้าถึงตำแหน่งได้ (ข้ามได้)'; }, {enableHighAccuracy:true, timeout:8000});
  }
  async function submitForm(){
    var poleId = POLE, manual=document.getElementById('manualPole');
    if(!poleId && manual) poleId = manual.value.trim();
    var name=document.getElementById('name').value.trim(), phone=document.getElementById('phone').value.trim(), detail=document.getElementById('detail').value.trim();
    if(!poleId){ alert('กรุณากรอกเลขเสา'); return; }
    if(!name||!phone||!detail){ alert('กรุณากรอก ชื่อ / เบอร์โทร / อาการที่พบ ให้ครบ'); return; }
    var btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='กำลังส่ง...';
    try {
      var r = await fetchT('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        pole_id:poleId, k:K, reporter_name:name, reporter_phone:phone, detail:detail, gps_lat:gps.lat, gps_lng:gps.lng,
        website:document.getElementById('website').value, opened_at:OPENED_AT })}, 25000);
      var res = await readJson(r);
      document.getElementById('formArea').classList.add('hidden');
      var d=document.getElementById('doneArea'); d.classList.remove('hidden');
      d.innerHTML = res.duplicate
        ? doneBox(bigIco('bell','bg-accent-soft text-accent-dark'),'เสานี้มีคนแจ้งไว้แล้ว','text-accent-dark','<p>เลขที่แจ้ง <span class="font-mono bg-brand-soft text-brand font-bold px-2 rounded">'+esc(res.report_id)+'</span><br>สถานะ: <b>'+esc(res.status)+'</b><br>'+ORG.dept+'กำลังดำเนินการ ไม่ต้องแจ้งซ้ำครับ</p>')
        : doneBox(bigIco('check','bg-green-50 text-[var(--done)]'),'รับเรื่องแล้ว','text-[var(--done)]','<p>เลขที่แจ้ง: <span class="font-mono bg-brand-soft text-brand font-bold px-2 rounded">'+esc(res.report_id)+'</span></p><p class="text-muted mt-2">เจ้าหน้าที่'+ORG.dept+'จะดำเนินการภายใน '+ORG.sla_days+' วันทำการ<br>ขอบคุณที่ช่วยดูแลชุมชนครับ</p><p class="text-xs text-muted mt-3">จดเลขที่แจ้งไว้เพื่อสอบถามความคืบหน้า โทร '+ORG.phone+'</p>');
      window.scrollTo(0,0);
    } catch(e){ btn.disabled=false; btn.textContent='ส่งเรื่องแจ้งซ่อม'; alert('ส่งไม่สำเร็จ: '+e.message+'\nกรุณาลองใหม่ หรือโทร '+ORG.phone); }
  }
  init();
</script>
</body>
</html>
